# 운영용: 모든 비밀 값은 환경 변수로 주입 (NFR-03, NFR-06). Swagger UI 끔 (D-07)
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

eduhub:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
  jwt:
    secret: ${JWT_SECRET}
