spring:
  application:
    name: eduhub
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant를 MySQL DATETIME(6)에 저장 (Flyway SQL과 일치)
    hibernate:
      ddl-auto: validate   # 모든 프로필에서 스키마는 Flyway(db/migration)가 만들고 JPA는 검증만 한다 (D-20)
  flyway:
    enabled: true
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100   # NFR-02: 한 번에 너무 많이 조회하지 않도록 제한

springdoc:
  swagger-ui:
    path: /swagger-ui.html

eduhub:
  jwt:
    expiration: 1h
